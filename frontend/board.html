<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">Task Board</title>
<link rel="stylesheet" href="style.css">
<style>
.board-wrap{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
.board-col{flex:1;min-width:280px;background:var(--surface2);border-radius:14px;padding:14px}
.board-col-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.board-count{background:rgba(0,0,0,.08);border-radius:10px;padding:1px 8px;font-size:11px}
.board-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;border-left:4px solid var(--yellow)}
.board-card.compulsory{border-left-width:6px;border-left-color:#ef4444}
.task-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.badge-high{background:rgba(239,68,68,.15);color:#b91c1c}
.badge-medium{background:rgba(245,158,11,.15);color:#b45309}
.badge-low{background:rgba(100,116,139,.15);color:#475569}
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark" id="sidebar-logo-mark">
      <svg class="logo-mark-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div>
      <div class="logo-text-wrap"><div class="logo-text" id="sidebar-logo-text"></div><div class="logo-sub" id="sidebar-company-short" style="display:none"></div></div>
    </div>
  </div>
  <nav id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <div id="sidebar-user"></div>
    <button class="logout-btn" onclick="Auth.logout()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign Out
    </button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Menu"><span></span><span></span><span></span></button>
      <div class="topbar-title">Task Board</div>
    </div>
    <div class="topbar-right">
      <select id="board-dept-filter" class="form-control" style="width:180px;display:none" onchange="loadBoard()">
        <option value="">All Departments</option>
      </select>
      <button id="notif-bell-btn" class="topbar-icon-btn notif-btn" title="Notifications">🔔<span id="notif-badge"></span></button>
      <a class="topbar-icon-btn" href="dashboard.html" title="Dashboard">🏠</a>
    </div>
  </div>

  <div class="content fade-in">
    <div id="board-container" class="board-wrap"><div class="loader"><div class="spinner"></div></div></div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
document.getElementById('page-title').textContent = window.CFG.clientName + ' - Task Board';
document.getElementById('sidebar-logo-text').innerHTML = window.CFG.logoHtml;
var _cs=document.getElementById('sidebar-company-sub')||document.getElementById('sidebar-company-short'); if(_cs) _cs.textContent=window.CFG.companyShortName||'';

Auth.guard();
buildSidebar('board.html');
loadNotifBadge();

const user = Auth.getUser();
const COL_LABELS = { pending: '🟡 Pending', in_progress: '🔵 In Progress', completed: '🟢 Completed' };

// "Manager" = has real reportees in the org chart, not the role label —
// resolved from the backend since the frontend can't know this on its own.
(async function init() {
  const mgrData = await api('GET', '/tasks/am-i-manager');
  const isSuperAdmin = !!mgrData?.data?.is_super_admin;
  const isManagerRole = !!mgrData?.data?.is_manager;
  if (!isSuperAdmin && !isManagerRole) {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:var(--muted)">Access denied — Task Board is available to Managers and Super Admin only.</div>';
    return;
  }
  if (isSuperAdmin) {
    document.getElementById('board-dept-filter').style.display = '';
    loadDepartments();
  }
  loadBoard();
})();

async function loadDepartments() {
  const data = await api('GET', '/departments');
  const sel = document.getElementById('board-dept-filter');
  (data?.data || []).forEach(d => { sel.innerHTML += `<option value="${d.id}">${d.name}</option>`; });
}

async function loadBoard() {
  const el = document.getElementById('board-container');
  el.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
  const deptId = document.getElementById('board-dept-filter')?.value || '';
  const qs = deptId ? `?department_id=${deptId}` : '';
  const data = await api('GET', `/tasks/board${qs}`);
  if (!data?.success) { el.innerHTML = '<div class="empty-state"><p>Failed to load board.</p></div>'; return; }

  el.innerHTML = data.order.map(status => {
    const tasks = data.data.columns[status] || [];
    return `
    <div class="board-col">
      <div class="board-col-title">${COL_LABELS[status]}<span class="board-count">${tasks.length}</span></div>
      ${tasks.map(renderCard).join('') || '<div style="font-size:12px;color:var(--muted);text-align:center;padding:20px 0">No tasks</div>'}
    </div>`;
  }).join('');
}

function renderCard(t) {
  const dueStr = t.due_date ? new Date(t.due_date).toLocaleDateString('en-IN', { day:'2-digit', month:'short' }) : null;
  return `
  <div class="board-card${t.is_compulsory ? ' compulsory' : ''}">
    <div style="font-weight:700;font-size:13px;margin-bottom:6px">${t.title}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
      ${t.is_compulsory ? '<span class="task-badge" style="background:#fee2e2;color:#b91c1c">🔴 Compulsory</span>' : ''}
      <span class="task-badge badge-${t.priority}">${t.priority}</span>
    </div>
    <div style="font-size:11px;color:var(--muted)">
      👤 ${t.assignee_name} (${t.assignee_code})${t.department_name ? ' · ' + t.department_name : ''}
      ${dueStr ? ' · Due ' + dueStr : ''}
    </div>
  </div>`;
}
</script>
</body>
</html>
