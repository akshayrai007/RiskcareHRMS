<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">Work Tracker</title>
<link rel="stylesheet" href="style.css">
<style>
.wt-tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap }
.wt-tab { padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600; border:1.5px solid var(--border); background:#fff; cursor:pointer; transition:all .15s }
.wt-tab.active { background:var(--accent); color:#fff; border-color:var(--accent) }
/* Colorful Excel-style report, solid black gridlines — matches KrishiHR exactly */
.wt-table { width:100%; border-collapse:collapse; font-size:12.5px; border:2px solid #0b0f19 }
.wt-table th { background:#26a69a; color:#fff; text-align:center; padding:9px 10px; font-weight:700; border:1px solid #37474f; white-space:nowrap; text-transform:uppercase; font-size:10.5px; letter-spacing:.03em; position:sticky; top:0; z-index:2 }
.wt-table td { padding:8px 10px; border:1px solid #37474f; vertical-align:middle; color:#263238 }
.wt-table tr.wt-detail:nth-of-type(even) td { background:#f5f8fb }
.wt-table tr.wt-detail:hover td { background:#fff8ec }
.wt-table td.wt-c { text-align:center; white-space:nowrap }
.wt-date-hdr td { background:#66bb6a; color:#fff; font-weight:800; cursor:pointer; padding:9px 12px; border:1px solid #37474f; user-select:none; font-size:13px; letter-spacing:.02em; text-shadow:0 1px 1px rgba(0,0,0,.15) }
.wt-date-hdr:hover td { background:#57a75b }
.wt-date-hdr .wt-caret { display:inline-block; width:14px; text-align:center; font-size:11px; margin-right:6px }
.wt-date-hdr .wt-cnt { color:#bbf7d0; font-weight:600; font-size:11px; margin-left:10px }
.wt-detail.collapsed { display:none }
.wt-team { display:inline-block; padding:2px 10px; border-radius:6px; font-size:11px; font-weight:700; color:#fff; border:1px solid rgba(0,0,0,.25) }
.wt-toggle { position:relative; width:40px; height:22px; border-radius:12px; background:#d1d5db; cursor:pointer; transition:background .15s; flex-shrink:0 }
.wt-toggle.on { background:#16a34a }
.wt-toggle .knob { position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.2) }
.wt-toggle.on .knob { left:20px }
.wt-req-row { display:flex; align-items:center; justify-content:space-between; padding:9px 14px; border-bottom:1px solid var(--border) }
.wt-req-row:last-child { border-bottom:none }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark" id="sidebar-logo-mark">
      <svg class="logo-mark-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div>
      <div class="logo-text-wrap"><div class="logo-text" id="sidebar-logo-text"></div><div class="logo-sub" id="sidebar-company-short" style="display:none"></div></div>
    </div>
  </div>
  <nav id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <div id="sidebar-user"></div>
    <button class="logout-btn" onclick="Auth.logout()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign Out
    </button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Menu"><span></span><span></span><span></span></button>
      <div class="topbar-title">📝 Work Tracker</div>
    </div>
    <div class="topbar-right">
      <button id="notif-bell-btn" class="topbar-icon-btn notif-btn" title="Notifications">🔔<span id="notif-badge"></span></button>
      <a class="topbar-icon-btn" href="dashboard.html" title="Dashboard">🏠</a>
    </div>
  </div>

  <div class="content fade-in">

    <div class="wt-tabs" id="wt-tabs">
      <button class="wt-tab" data-tab="mine" onclick="switchTab('mine')" id="wt-tab-mine">📝 My Report</button>
      <button class="wt-tab" data-tab="team" onclick="switchTab('team')" id="wt-tab-team">📅 Team Reports</button>
      <button class="wt-tab" data-tab="manage" onclick="switchTab('manage')" id="wt-tab-manage" style="display:none">👥 Manage</button>
    </div>

    <!-- MY REPORT — self-submit, every employee -->
    <div class="card" id="wt-mine-card" style="display:none">
      <div class="card-header"><div class="section-title" style="margin:0">Submit Today's Work Report</div></div>
      <div id="wt-mine-form" style="padding:18px 22px"></div>
    </div>

    <!-- TEAM REPORTS — date-grouped table, everyone sees own scope -->
    <div id="wt-team-wrap" style="display:none">
      <div class="card" style="margin-bottom:16px">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:flex-end">
          <div class="form-group" style="margin:0">
            <label class="form-label">From Date</label>
            <input type="date" id="wt-from" class="form-control">
          </div>
          <div class="form-group" style="margin:0">
            <label class="form-label">To Date</label>
            <input type="date" id="wt-to" class="form-control">
          </div>
          <button class="btn btn-primary" onclick="loadTeamReports()">🔍 Search</button>
          <button class="btn btn-outline" onclick="downloadReports()">⬇ Download Excel</button>
        </div>
      </div>
      <div class="card">
        <div style="overflow-x:auto">
          <table class="wt-table" id="wt-table">
            <thead><tr id="wt-thead-row"></tr></thead>
            <tbody id="wt-tbody"><tr><td style="text-align:center;padding:24px;color:#9ca3af">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- MANAGE — admin-tier only: toggle who's flagged "required" -->
    <div id="wt-manage-wrap" style="display:none">
      <div class="card" style="padding:0">
        <div class="card-header" style="padding:16px 22px">
          <div class="card-title"><span class="card-title-icon">👥</span>Who Must Fill Work Tracker</div>
          <select id="mgmt-dept-filter" class="form-control" style="width:180px" onchange="loadRequiredList()">
            <option value="">All Departments</option>
          </select>
        </div>
        <div id="required-list-content"><div class="loader"><div class="spinner"></div></div></div>
      </div>
    </div>

  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
document.getElementById('page-title').textContent = window.CFG.clientName + ' - Work Tracker';
document.getElementById('sidebar-logo-text').innerHTML = window.CFG.logoHtml;
var _cs=document.getElementById('sidebar-company-sub')||document.getElementById('sidebar-company-short'); if(_cs) _cs.textContent=window.CFG.companyShortName||'';

Auth.guard();
buildSidebar('work-tracker.html');
loadNotifBadge();

const user = Auth.getUser();
let canManage = false;
const PROGRESS_TEAMS = ['Survey', 'QC', 'Development', 'Remote Sensing', 'Other'];

(async function init() {
  // Matches KrishiHR exactly: ANY employee can submit/view their own log,
  // always — no gating. can_manage_others (HR/Accounts/Admin/Super Admin,
  // admin-tier only) additionally unlocks Manage.
  const status = await api('GET', '/work-tracker/my-status');
  canManage = !!status?.data?.can_manage_others;
  if (canManage) {
    document.getElementById('wt-tab-manage').style.display = 'inline-block';
    loadDepartments();
  }

  const todayStr = new Date().toISOString().slice(0,10);
  const weekAgo = new Date(Date.now() - 7*86400000).toISOString().slice(0,10);
  document.getElementById('wt-from').value = weekAgo;
  document.getElementById('wt-to').value = todayStr;

  switchTab('mine');
})();

function switchTab(tab) {
  document.querySelectorAll('#wt-tabs .wt-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('wt-mine-card').style.display = 'none';
  document.getElementById('wt-team-wrap').style.display = 'none';
  document.getElementById('wt-manage-wrap').style.display = 'none';
  if (tab === 'mine') {
    document.getElementById('wt-mine-card').style.display = 'block';
    renderMineForm();
  } else if (tab === 'manage') {
    document.getElementById('wt-manage-wrap').style.display = 'block';
    loadRequiredList();
  } else {
    document.getElementById('wt-team-wrap').style.display = 'block';
    loadTeamReports();
  }
}

async function loadDepartments() {
  const data = await api('GET', '/departments');
  const sel = document.getElementById('mgmt-dept-filter');
  (data?.data || []).forEach(d => { sel.innerHTML += `<option value="${d.id}">${d.name}</option>`; });
}

// ── My Report (self-submit, edit-in-place for today) ────────────────────────
async function renderMineForm() {
  const wrap = document.getElementById('wt-mine-form');
  let cur = {};
  try { const r = await api('GET', '/work-tracker/today'); cur = r?.data || {}; } catch (_) {}
  wrap.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
      <div class="form-group" style="margin:0">
        <label class="form-label">Team</label>
        <select id="pg-team" class="form-control">${PROGRESS_TEAMS.map(t => `<option ${cur.team === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label">% Done Today</label>
        <input id="pg-done" class="form-control" type="number" min="0" max="100" value="${cur.percent_done ?? ''}" placeholder="e.g. 50" oninput="pgRemain()">
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label">% Remaining</label>
        <input id="pg-remain" class="form-control" value="${cur.percent_remaining != null ? cur.percent_remaining + '%' : ''}" disabled>
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label">Estimated Finish Date</label>
        <input id="pg-est" class="form-control" type="date" value="${cur.est_finish_date ? String(cur.est_finish_date).slice(0,10) : ''}">
      </div>
    </div>
    <div class="form-group" style="margin-top:12px">
      <label class="form-label">Today's Task — what are you working on? *</label>
      <textarea id="pg-today" class="form-control" rows="3" placeholder="e.g. QC of 200 acreage records for the dataset">${cur.today_task || ''}</textarea>
    </div>
    <div class="form-group" style="margin-top:12px">
      <label class="form-label">This Week's Task / Goal (optional)</label>
      <textarea id="pg-week" class="form-control" rows="2" placeholder="e.g. Finish QC by Friday">${cur.week_task || ''}</textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
      <div class="form-group" style="margin:0"><label class="form-label">Blockers (optional)</label><textarea id="pg-blockers" class="form-control" rows="2" placeholder="e.g. Waiting on missing data">${cur.blockers || ''}</textarea></div>
      <div class="form-group" style="margin:0"><label class="form-label">Remark (optional)</label><textarea id="pg-remark" class="form-control" rows="2" placeholder="e.g. Internet issues today">${cur.remark || ''}</textarea></div>
    </div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="submitMine()">✅ ${cur.id ? 'Update' : 'Submit'} Today's Progress</button>
    ${cur.id ? '<div style="font-size:12px;color:#16a34a;margin-top:8px">✓ You have already submitted today — editing updates it.</div>' : ''}
  `;
  pgRemain();
}
function pgRemain() {
  let d = parseInt(document.getElementById('pg-done')?.value);
  if (isNaN(d)) { document.getElementById('pg-remain').value = ''; return; }
  d = Math.max(0, Math.min(100, d));
  document.getElementById('pg-remain').value = (100 - d) + '%';
}

async function submitMine() {
  const today_task = document.getElementById('pg-today').value.trim();
  if (!today_task) { toast("Describe today's task", 'error'); return; }
  const res = await api('POST', '/work-tracker/submit', {
    team: document.getElementById('pg-team').value,
    today_task,
    percent_done: document.getElementById('pg-done').value || 0,
    week_task: document.getElementById('pg-week').value.trim() || null,
    est_finish_date: document.getElementById('pg-est').value || null,
    blockers: document.getElementById('pg-blockers').value.trim() || null,
    remark: document.getElementById('pg-remark').value.trim() || null,
  });
  if (res?.success) {
    toast('Progress submitted', 'success');
    renderMineForm();
  } else {
    toast(res?.message || 'Failed to submit', 'error');
  }
}

// ── Team Reports — date-grouped colourful table (matches KrishiHR exactly) ──
async function loadTeamReports() {
  const thead = document.getElementById('wt-thead-row');
  thead.innerHTML = ['Date','Employee','Code','Team',"Today's Task",'% Done','% Remain','This Week','Est. Finish','Blockers','Remark', canManage ? 'Delete' : '']
    .map(h => `<th>${h}</th>`).join('');
  const tbody = document.getElementById('wt-tbody');
  const colspan = canManage ? 12 : 11;
  tbody.innerHTML = `<tr><td colspan="${colspan}" style="text-align:center;padding:24px;color:#9ca3af">Loading…</td></tr>`;
  const from = document.getElementById('wt-from').value;
  const to = document.getElementById('wt-to').value;
  let url = '/work-tracker/logs?';
  if (from) url += `from_date=${from}&`;
  if (to) url += `to_date=${to}&`;
  const res = await api('GET', url);
  if (!res?.success) { tbody.innerHTML = `<tr><td colspan="${colspan}" style="text-align:center;padding:24px;color:#ef4444">Failed to load</td></tr>`; return; }
  const rows = res.data || [];
  if (!rows.length) { tbody.innerHTML = `<tr><td colspan="${colspan}" style="text-align:center;padding:24px;color:#9ca3af">No reports found</td></tr>`; return; }

  const groups = []; const gidx = new Map();
  for (const r of rows) {
    const key = fmt.date(r.log_date);
    if (!gidx.has(key)) { gidx.set(key, groups.length); groups.push({ key, rows: [] }); }
    groups[gidx.get(key)].rows.push(r);
  }
  const teamColor = (t) => { const k = (t || '').toLowerCase(); return k.includes('survey') ? '#42a5f5' : k.includes('qc') ? '#ab47bc' : k.includes('mis') ? '#26c6da' : '#26a69a'; };
  const detailRow = (r, gid) => {
    const p = Math.max(0, Math.min(100, parseInt(r.percent_done) || 0));
    const rem = r.percent_remaining ?? (100 - p);
    const doneBg = p >= 100 ? '#66bb6a' : p >= 50 ? '#42a5f5' : '#ffb74d';
    const doneFg = p >= 50 ? '#fff' : '#7a4f01';
    const remBg = rem <= 0 ? '#eceff1' : rem >= 50 ? '#ef5350' : '#ffb74d';
    const remFg = rem <= 0 ? '#78909c' : rem >= 50 ? '#fff' : '#7a4f01';
    return `<tr class="wt-detail" data-dg="${gid}">
    <td class="wt-c" style="font-size:11.5px">${fmt.date(r.log_date)}</td>
    <td style="font-weight:700;color:#263238">${r.employee_name || ''}</td>
    <td class="wt-c" style="font-weight:600">${r.employee_code || ''}</td>
    <td class="wt-c">${r.team ? `<span class="wt-team" style="background:${teamColor(r.team)}">${r.team}</span>` : '—'}</td>
    <td style="max-width:260px;white-space:normal">${r.today_task || ''}</td>
    <td class="wt-c" style="background:${doneBg};color:${doneFg};font-weight:800">${p}%</td>
    <td class="wt-c" style="background:${remBg};color:${remFg};font-weight:700">${rem}%</td>
    <td style="max-width:200px;white-space:normal">${r.week_task || '—'}</td>
    <td class="wt-c" style="font-size:11.5px">${r.est_finish_date ? fmt.date(r.est_finish_date) : '—'}</td>
    <td style="max-width:180px;white-space:normal">${r.blockers || '—'}</td>
    <td style="max-width:180px;white-space:normal">${r.remark || '—'}</td>
    ${canManage ? `<td class="wt-c"><button class="btn btn-outline btn-sm" style="color:#b91c1c;border-color:#fecaca" onclick="deleteLog(${r.id})">🗑</button></td>` : ''}
  </tr>`;
  };
  tbody.innerHTML = groups.map((g, gi) => {
    const gid = 'dg' + gi;
    const n = g.rows.length;
    const header = `<tr class="wt-date-hdr" onclick="toggleDate('${gid}',this)">
      <td colspan="${colspan}"><span class="wt-caret">▾</span>${g.key}<span class="wt-cnt">${n} ${n === 1 ? 'entry' : 'entries'}</span></td>
    </tr>`;
    return header + g.rows.map(r => detailRow(r, gid)).join('');
  }).join('');
}

function toggleDate(gid, el) {
  const collapsed = el.classList.toggle('collapsed');
  const caret = el.querySelector('.wt-caret');
  if (caret) caret.textContent = collapsed ? '▸' : '▾';
  document.querySelectorAll(`#wt-tbody tr.wt-detail[data-dg="${gid}"]`)
    .forEach(tr => tr.classList.toggle('collapsed', collapsed));
}

async function deleteLog(id) {
  if (!confirm('Delete this progress entry? This cannot be undone.')) return;
  const res = await api('DELETE', `/work-tracker/${id}`);
  if (res?.success) { toast('Deleted', 'success'); loadTeamReports(); }
  else toast(res?.message || 'Failed to delete', 'error');
}

function downloadReports() {
  const from = document.getElementById('wt-from').value;
  const to = document.getElementById('wt-to').value;
  let url = `${API_BASE}/work-tracker/export?`;
  if (from) url += `from_date=${from}&`;
  if (to) url += `to_date=${to}&`;
  url += `token=${encodeURIComponent(Auth.getToken())}`;
  window.open(url, '_blank');
}

// ── Manage — admin-tier: toggle "required" ──────────────────────────────────
async function loadRequiredList() {
  const el = document.getElementById('required-list-content');
  el.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
  const deptId = document.getElementById('mgmt-dept-filter')?.value || '';
  const qs = deptId ? `?department_id=${deptId}` : '';
  const data = await api('GET', `/work-tracker/required-list${qs}`);
  if (!data?.success || !data.data?.length) {
    el.innerHTML = '<div class="empty-state" style="padding:24px"><p style="color:var(--muted)">No employees to manage.</p></div>';
    return;
  }
  el.innerHTML = data.data.map(e => `
    <div class="wt-req-row">
      <div>
        <div style="font-weight:600;font-size:13px">${e.name} <span style="color:var(--muted);font-weight:400">(${e.employee_code})</span></div>
        ${e.department_name ? `<div style="font-size:11px;color:var(--muted)">${e.department_name}</div>` : ''}
      </div>
      <div class="wt-toggle ${e.work_tracker_required ? 'on' : ''}" onclick="toggleRequired(${e.id}, ${!e.work_tracker_required}, this)"><div class="knob"></div></div>
    </div>`).join('');
}

async function toggleRequired(employeeId, required, el) {
  const data = await api('POST', '/work-tracker/set-required', { employee_id: employeeId, required });
  if (data?.success) {
    el.classList.toggle('on', required);
    toast(required ? 'Marked as required' : 'Marked as not required', 'success');
  } else {
    toast(data?.message || 'Failed to update', 'error');
  }
}
</script>
</body>
</html>
