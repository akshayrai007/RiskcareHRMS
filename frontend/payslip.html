<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">My Payslip</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
@media print {
  .sidebar, .topbar, .no-print { display: none !important; }
  .main { margin-left: 0 !important; }
  .content { padding: 0 !important; }
  @page { size: A4 portrait; margin: 10mm 8mm; }
  #payslip-area > div { max-width: 100% !important; }
}
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark" id="sidebar-logo-mark">
      <svg class="logo-mark-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div>
      <div class="logo-text-wrap"><div class="logo-text" id="sidebar-logo-text"></div><div class="logo-sub" id="sidebar-company-short" style="display:none"></div></div>
    </div>
  </div>
  <nav id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <div id="sidebar-user"></div>
    <button class="logout-btn" onclick="Auth.logout()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign Out
    </button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Menu"><span></span><span></span><span></span></button>
      <div class="topbar-title">My Payslip</div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-outline btn-sm no-print" onclick="window.print()" id="print-btn" style="display:none">🖨 Print / Download PDF</button>
      <button id="notif-bell-btn" class="topbar-icon-btn notif-btn" title="Notifications">🔔<span id="notif-badge"></span></button>
      <a class="topbar-icon-btn" href="dashboard.html" title="Dashboard">🏠</a>
    </div>
  </div>

  <div class="content fade-in">

    <!-- Month Selector -->
    <div class="card no-print" style="padding:16px 22px;margin-bottom:20px">
      <div class="flex gap-3" style="align-items:flex-end;flex-wrap:wrap">
        <div>
          <div class="form-label">Month</div>
          <select id="ps-month" class="form-control" style="width:150px"></select>
        </div>
        <div>
          <div class="form-label">Year</div>
          <select id="ps-year" class="form-control" style="width:100px"></select>
        </div>
        <button class="btn btn-primary" onclick="loadPayslip()">Load Payslip</button>
        <div id="available-months" style="flex:1"></div>
      </div>
    </div>

    <!-- Payslip Render Area -->
    <div id="payslip-area">
      <div class="empty-state">
        <div class="empty-icon">💰</div>
        <p>Select a month above and click <b>Load Payslip</b> to view your salary details.</p>
      </div>
    </div>

  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
// ── Apply CFG identity ─────────────────────────────────────────────────────
document.getElementById('page-title').textContent = window.CFG.clientName + ' - My Payslip';
document.getElementById('sidebar-logo-text').innerHTML = window.CFG.logoHtml;
var _cs=document.getElementById('sidebar-company-sub')||document.getElementById('sidebar-company-short'); if(_cs) _cs.textContent=window.CFG.companyShortName||'';

Auth.guard();
buildSidebar('payslip.html');
loadNotifBadge();

const NOW = new Date();

// Populate selectors
const monthSel = document.getElementById('ps-month');
const yearSel  = document.getElementById('ps-year');
fmt.months.forEach((m,i) => monthSel.innerHTML += `<option value="${i+1}" ${i+1===NOW.getMonth()+1?'selected':''}>${m}</option>`);
for (let y = NOW.getFullYear(); y >= 2020; y--)
  yearSel.innerHTML += `<option value="${y}" ${y===NOW.getFullYear()?'selected':''}>${y}</option>`;

// Load available payslip months
loadAvailableMonths();

async function loadAvailableMonths() {
  const data = await api('GET', '/my/payslip-months');
  if (!data?.success || !data.data?.length) return;
  const el = document.getElementById('available-months');
  el.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600">Available Payslips:</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${data.data.slice(0,12).map(p => `
        <button class="btn btn-outline btn-sm" onclick="quickLoad(${p.month},${p.year})" style="font-size:11px;padding:4px 10px">
          ${fmt.months[p.month-1].slice(0,3)} ${p.year}
          <span class="badge badge-${p.status}" style="font-size:9px;margin-left:4px">${p.status}</span>
        </button>`).join('')}
    </div>`;
}

function quickLoad(month, year) {
  document.getElementById('ps-month').value = month;
  document.getElementById('ps-year').value  = year;
  loadPayslip();
}

async function loadPayslip() {
  const month = document.getElementById('ps-month').value;
  const year  = document.getElementById('ps-year').value;
  const el    = document.getElementById('payslip-area');
  el.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

  const data = await api('GET', `/my/payslip?month=${month}&year=${year}`);
  if (!data?.success) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📄</div>
      <p>No payslip found for ${fmt.months[month-1]} ${year}.</p>
      <p class="text-muted" style="margin-top:8px;font-size:13px">Payroll may not have been processed yet for this month.<br>Contact your HR department.</p>
    </div>`;
    document.getElementById('print-btn').style.display = 'none';
    return;
  }

  const p = data.data;
  el.innerHTML = renderPayslip(p);
  document.getElementById('print-btn').style.display = 'flex';
}

function renderPayslip(p) {
  const gross    = parseFloat(p.gross_salary || 0);
  const pfEmp    = parseFloat(p.pf_employee  || 0);
  const esiEmp   = parseFloat(p.esi_employee || 0);
  const pt       = parseFloat(p.professional_tax || 0);
  const tds      = parseFloat(p.tds          || 0);
  const loanEmi  = parseFloat(p.loan_emi_recovery || 0);

  const empDedTotal = pfEmp + esiEmp + pt + tds + loanEmi;
  const netPay = gross - empDedTotal;

  const wDays = parseFloat(p.working_days || 30);
  const paidDays = parseFloat(p.paid_days || wDays);
  const lopDays = parseFloat(p.lop_days || 0);
  const mon = fmt.months[parseInt(p.month)-1] + ' ' + p.year;

  const fmtDate = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}).replace(/ /g,'-') : '';
  const dob = fmtDate(p.date_of_birth);
  const doj = fmtDate(p.joining_date);
  const location = p.location || [p.city, p.state].filter(Boolean).join(', ') || '';
  const esiNo = p.esi_number || (esiEmp > 0 ? '' : 'Not Applicable');

  const Rs = v => { const n = parseFloat(v); return n > 0 ? n.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}) : ''; };
  const C = window.CFG;

  // Earning rows: Fixed Amount = full month, Earning Amount = prorated
  const basic = parseFloat(p.basic || 0);
  const hra = parseFloat(p.hra || 0);
  const gratuity = parseFloat(p.gratuity || 0);
  const special = parseFloat(p.special_allowance || p.conveyance || 0);
  const conveyance = parseFloat(p.conveyance || 0);

  const earningItems = [
    { label: 'Basic', fixed: basic, earned: basic },
    { label: 'House Rent Allowance', fixed: hra, earned: hra },
    { label: 'Fixed Gratuity', fixed: gratuity, earned: gratuity },
    { label: 'Defray Allowance', fixed: special, earned: special },
  ].filter(r => r.fixed > 0);

  // If conveyance is separate from special_allowance
  if (conveyance > 0 && p.special_allowance && parseFloat(p.special_allowance) > 0) {
    earningItems.splice(3, 0, { label: 'Conveyance', fixed: conveyance, earned: conveyance });
  }

  const dedItems = [
    { label: 'ProfessionalTax', amount: pt },
    { label: 'ProvidentFund', amount: pfEmp },
    { label: 'TDS', amount: tds },
    { label: 'ESI', amount: esiEmp },
    { label: 'EMI Recovery', amount: loanEmi },
  ].filter(r => r.amount > 0);

  const maxRows = Math.max(earningItems.length, dedItems.length);

  let earningsRows = '';
  for (let i = 0; i < maxRows; i++) {
    const e = earningItems[i];
    const d = dedItems[i];
    earningsRows += `<tr>
      <td style="padding:4px 12px;border:1px solid #999;font-size:12px">${e ? e.label : ''}</td>
      <td style="padding:4px 8px;border:1px solid #999;font-size:12px;text-align:right">${e ? Rs(e.fixed) : ''}</td>
      <td style="padding:4px 8px;border:1px solid #999;font-size:12px;text-align:right">${e ? Rs(e.earned) : ''}</td>
      <td style="padding:4px 12px;border:1px solid #999;font-size:12px">${d ? d.label : ''}</td>
      <td style="padding:4px 8px;border:1px solid #999;font-size:12px;text-align:right">${d ? Rs(d.amount) : ''}</td>
    </tr>`;
  }

  // Leave balance table
  const leaves = p.leave_balances || [];
  const leaveMap = { EL: 'Earned Leave', SL: 'Sick or Casual Leave', CL: 'Casual Leave', PL: 'Privilege Leave' };
  let leaveRows = leaves.map(l => {
    const name = leaveMap[l.code] || l.name;
    const alloc = parseFloat(l.allocated || 0);
    const used = parseFloat(l.used || 0);
    const avail = parseFloat(l.available || 0);
    const cf = parseFloat(l.carry_forward || 0);
    const opening = cf > 0 ? cf.toFixed(2) : (alloc - used > 0 ? (alloc - used).toFixed(2) : '0.00');
    return `<tr>
      <td style="padding:4px 12px;border:1px solid #999;font-size:12px">${name}</td>
      <td style="padding:4px 8px;border:1px solid #999;font-size:12px;text-align:right">${opening}</td>
      <td style="padding:4px 8px;border:1px solid #999;font-size:12px;text-align:right">0.00</td>
      <td style="padding:4px 8px;border:1px solid #999;font-size:12px;text-align:right">0.00</td>
      <td style="padding:4px 8px;border:1px solid #999;font-size:12px;text-align:right">${used.toFixed(2)}</td>
      <td style="padding:4px 8px;border:1px solid #999;font-size:12px;text-align:right">${avail.toFixed(2)}</td>
      <td style="padding:4px 8px;border:1px solid #999;font-size:12px;text-align:right">0.00</td>
    </tr>`;
  }).join('');

  const infoRow = (label, val) => `<tr>
    <td style="padding:3px 16px;font-size:12px;font-weight:700;white-space:nowrap">${label}</td>
    <td style="padding:3px 4px;font-size:12px">: ${val || ''}</td>
  </tr>`;

  return `<div style="font-family:Arial,Helvetica,sans-serif;background:#fff;color:#000;max-width:794px;margin:0 auto;padding:0">

  <!-- HEADER -->
  <table style="width:100%;border-collapse:collapse">
    <tr>
      <td style="padding:12px 16px;width:100px;vertical-align:top">
        ${C.logoUrl ? '<img src="'+C.logoUrl+'" style="max-width:90px;max-height:65px;object-fit:contain">' : ''}
      </td>
      <td style="padding:12px 16px;text-align:center;vertical-align:middle">
        <div style="font-size:20px;font-weight:700;color:#1a237e">Risk Care Insurance Broking Services Private Limited</div>
        <div style="font-size:11px;color:#333;margin-top:4px"># 708, 7th. Floor, 'Hubtown VIVA',, Western Express Highway, Shankarwadi,, Jogeshwari (East), Mumbai</div>
        <div style="font-size:11px;color:#333">MUMBAI - 400060, MAHARASHTRA</div>
      </td>
    </tr>
  </table>

  <!-- TITLE BAR -->
  <div style="text-align:center;padding:8px;font-size:14px;font-weight:700;color:#1a237e;border-top:2px solid #1565c0;border-bottom:2px solid #1565c0;background:#e3f2fd">
    Payslip for ${mon}
  </div>

  <!-- NOTE -->
  <div style="padding:6px 16px;font-size:10px;color:#c62828;font-weight:700">
    Note : Payslip is system generated hence signature is not required
  </div>

  <!-- EMPLOYEE INFO: two-column layout -->
  <table style="width:100%;border-collapse:collapse;margin-bottom:12px">
    <tr>
      <td style="width:50%;vertical-align:top;padding:0 16px 0 0">
        <table style="width:100%;border-collapse:collapse">
          ${infoRow('Employee Code', p.employee_code)}
          ${infoRow('Name', p.employee_name)}
          ${infoRow('Designation', p.designation_title)}
          ${infoRow('Department', p.department_name)}
          ${infoRow('Gender', p.gender)}
          ${infoRow('Date of Birth', dob)}
          ${infoRow('Date of Joining', doj)}
          ${infoRow('Attendance: Base,Elig', paidDays.toFixed(2) + ', ' + paidDays.toFixed(2))}
          ${infoRow('Previous Period LOP, LOP<br>Reversal Days', lopDays.toFixed(1) + ', 0.0')}
        </table>
      </td>
      <td style="width:50%;vertical-align:top;padding:0 0 0 16px">
        <table style="width:100%;border-collapse:collapse">
          ${infoRow('Bank', p.bank_name)}
          ${infoRow('Bank A/C No.', p.bank_account)}
          ${infoRow('Location', location)}
          ${infoRow('PAN', p.pan_number)}
          ${infoRow('Project', '')}
          ${infoRow('UAN', p.uan_number)}
          ${infoRow('PF A/C No.', p.pf_number)}
          ${infoRow('ESI No.', esiNo)}
        </table>
      </td>
    </tr>
  </table>

  <!-- EARNINGS & DEDUCTIONS TABLE -->
  <table style="width:100%;border-collapse:collapse;margin:0 0 4px 0">
    <tr style="background:#e3f2fd">
      <th style="padding:5px 12px;border:1px solid #999;font-size:12px;font-weight:700;text-align:left;width:28%">Earnings</th>
      <th style="padding:5px 8px;border:1px solid #999;font-size:12px;font-weight:700;text-align:right;width:14%">Fixed Amount</th>
      <th style="padding:5px 8px;border:1px solid #999;font-size:12px;font-weight:700;text-align:right;width:14%">Earning Amount</th>
      <th style="padding:5px 12px;border:1px solid #999;font-size:12px;font-weight:700;text-align:left;width:28%">Deductions</th>
      <th style="padding:5px 8px;border:1px solid #999;font-size:12px;font-weight:700;text-align:right;width:16%">Amount</th>
    </tr>
    ${earningsRows}
    <tr style="background:#e8f5e9;font-weight:700">
      <td style="padding:5px 12px;border:1px solid #999;font-size:12px;font-weight:700">Total Earnings</td>
      <td style="padding:5px 8px;border:1px solid #999;font-size:12px;font-weight:700;text-align:right">${Rs(gross)}</td>
      <td style="padding:5px 8px;border:1px solid #999;font-size:12px;font-weight:700;text-align:right">${Rs(gross)}</td>
      <td style="padding:5px 12px;border:1px solid #999;font-size:12px;font-weight:700">Total Deductions</td>
      <td style="padding:5px 8px;border:1px solid #999;font-size:12px;font-weight:700;text-align:right">${Rs(empDedTotal)}</td>
    </tr>
  </table>

  <!-- NET SALARY -->
  <div style="padding:8px 16px;font-size:13px;font-weight:700;border-top:2px solid #1565c0">
    Net Salary : ${Rs(netPay)} <i>(${numberToWords(netPay)} Only)</i>
  </div>

  <!-- LEAVE BALANCE TABLE -->
  ${leaves.length ? `
  <table style="width:100%;border-collapse:collapse;margin-top:12px">
    <tr style="background:#e3f2fd">
      <th style="padding:5px 12px;border:1px solid #999;font-size:11px;font-weight:700;text-align:left">Leave Type</th>
      <th style="padding:5px 8px;border:1px solid #999;font-size:11px;font-weight:700;text-align:right">Opening Balance</th>
      <th style="padding:5px 8px;border:1px solid #999;font-size:11px;font-weight:700;text-align:right">Current Month<br>Credit</th>
      <th style="padding:5px 8px;border:1px solid #999;font-size:11px;font-weight:700;text-align:right">Leaves<br>Withdrawn<br>/Rejected of<br>previous month</th>
      <th style="padding:5px 8px;border:1px solid #999;font-size:11px;font-weight:700;text-align:right">Leaves Utilized</th>
      <th style="padding:5px 8px;border:1px solid #999;font-size:11px;font-weight:700;text-align:right">Available<br>Balance</th>
      <th style="padding:5px 8px;border:1px solid #999;font-size:11px;font-weight:700;text-align:right">Leave Lapsed</th>
    </tr>
    ${leaveRows}
  </table>` : ''}

  <!-- FOOTER -->
  <div style="display:flex;justify-content:space-between;padding:20px 16px 10px;font-size:10px;color:#666;margin-top:40px">
    <span>Page 1 of 1</span>
    <span>Downloaded On ${new Date().toLocaleString('en-IN')}</span>
  </div>

  </div>`;
}

function numberToWords(amount) {
  if (!amount || isNaN(amount)) return 'Zero ' + window.CFG.currencyWord;
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function inWords(n) {
    if (n < 20) return a[n];
    if (n < 100) return b[Math.floor(n/10)] + (n%10?' '+a[n%10]:'');
    if (n < 1000) return a[Math.floor(n/100)] + ' Hundred' + (n%100?' '+inWords(n%100):'');
    if (n < 100000) return inWords(Math.floor(n/1000)) + ' Thousand' + (n%1000?' '+inWords(n%1000):'');
    if (n < 10000000) return inWords(Math.floor(n/100000)) + ' Lakh' + (n%100000?' '+inWords(n%100000):'');
    return inWords(Math.floor(n/10000000)) + ' Crore' + (n%10000000?' '+inWords(n%10000000):'');
  }
  const rupees = Math.floor(parseFloat(amount));
  return (inWords(rupees)||'Zero') + ' ' + window.CFG.currencyWord;
}
</script>
</body>
</html>
