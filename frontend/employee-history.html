<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">Salary &amp; Promotions</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.hist-table { width:100%;border-collapse:collapse;min-width:900px }
.hist-table th { border:1px solid #9ca3af;background:#1e293b;color:#fff;font-size:11px;font-weight:700;padding:10px 12px;text-align:center;white-space:nowrap }
.hist-table td { border:1px solid #e5e7eb;padding:9px 12px;font-size:12px;vertical-align:middle;text-align:center }
.hist-table tr:nth-child(even) td { background:#f9fafb }
.hist-table tr:hover td { background:#f0f4ff;cursor:pointer }
.hist-avatar { width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;object-fit:cover }
.count-pill { display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700 }
.pill-salary { background:#dcfce7;color:#166534 }
.pill-promo  { background:#e0e7ff;color:#3730a3 }
.pill-zero   { background:#f1f5f9;color:#94a3b8 }
.search-bar { display:flex;gap:10px;align-items:center;margin-bottom:16px }
.search-bar input { flex:1;max-width:340px;padding:9px 14px;border-radius:10px;border:1.5px solid var(--border);font-size:13px }
/* Timeline inside popup */
.tl-item { display:flex;gap:12px;padding:14px 0;border-bottom:1px dashed var(--border) }
.tl-item:last-child { border-bottom:none }
.tl-dot { width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0 }
.tl-dot.salary { background:#dcfce7 }
.tl-dot.promotion { background:#e0e7ff }
.tl-body { flex:1 }
.tl-title { font-size:13px;font-weight:700;color:var(--text) }
.tl-date { font-size:11px;color:var(--muted);margin-top:1px }
.tl-diff { margin-top:8px;display:flex;flex-wrap:wrap;gap:8px }
.tl-chip { background:var(--surface2);border-radius:8px;padding:5px 10px;font-size:11.5px }
.tl-chip .lbl { color:var(--muted);margin-right:4px }
.tl-chip .old { text-decoration:line-through;color:#ef4444;opacity:.7 }
.tl-chip .new { color:#166534;font-weight:700 }
.tl-remarks { margin-top:6px;font-size:11.5px;color:var(--muted);font-style:italic }
.tl-by { margin-top:6px;font-size:11px;color:var(--muted) }
.empty-state { text-align:center;padding:40px 20px;color:var(--muted) }
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark" id="sidebar-logo-mark">
      <svg class="logo-mark-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div><div class="logo-text-wrap"><div class="logo-text" id="sidebar-logo-text"></div></div></div>
  </div>
  <nav id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <div id="sidebar-user"></div>
    <button class="logout-btn" onclick="Auth.logout()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign Out
    </button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger-btn" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
      <div class="topbar-title">📈 Salary &amp; Promotions</div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-outline btn-sm" onclick="loadEmployeeHistoryList()">🔄 Refresh</button>
      <a class="topbar-icon-btn" href="org-chart.html" title="Org Chart">🧭</a>
      <a class="topbar-icon-btn" href="dashboard.html" title="Dashboard">🏠</a>
    </div>
  </div>

  <div class="content fade-in">
    <div class="card">
      <div class="search-bar">
        <input type="text" id="hist-search" placeholder="Search by name, code or email..." oninput="debounceSearch()">
        <span style="font-size:12px;color:var(--muted)" id="hist-count"></span>
      </div>
      <div style="overflow-x:auto">
        <table class="hist-table">
          <thead>
            <tr>
              <th style="text-align:left">Employee</th>
              <th>Department</th>
              <th>Designation</th>
              <th>Level</th>
              <th>Salary Changes</th>
              <th>Last Salary Change</th>
              <th>Promotions</th>
              <th>Last Promotion</th>
            </tr>
          </thead>
          <tbody id="hist-tbody">
            <tr><td colspan="8" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Popup: full history for one employee -->
<div class="modal-backdrop" id="hist-detail-modal">
  <div class="modal modal-lg" style="max-height:88vh;width:min(1150px,96vw);max-width:96vw">
    <div class="modal-header">
      <div class="modal-title" id="hist-detail-title">Employee History</div>
      <button class="modal-close" onclick="closeModal('hist-detail-modal')">✕</button>
    </div>
    <div class="modal-body" id="hist-detail-body" style="overflow-y:auto;max-height:72vh"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
if (!Auth.guard()) { }
buildSidebar('employee-history.html');

// Restrict this page to Accounts / HR / Admin / Super Admin
(function guardRole(){
  const role = Auth.getUser()?.role;
  const allowed = ['hr','hr admin','accounts','accounts admin','admin','super_admin'];
  if (!allowed.includes(role)) { window.location.href = 'dashboard.html'; }
})();

let __histRows = [];
let __searchTimer = null;

function debounceSearch(){
  clearTimeout(__searchTimer);
  __searchTimer = setTimeout(loadEmployeeHistoryList, 300);
}

async function loadEmployeeHistoryList() {
  const tbody = document.getElementById('hist-tbody');
  tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Loading…</td></tr>';
  const q = document.getElementById('hist-search').value.trim();
  const res = await api('GET', '/history/employees' + (q ? ('?search=' + encodeURIComponent(q)) : ''));
  if (!res || !res.success) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Could not load data.</td></tr>';
    return;
  }
  __histRows = res.data || [];
  document.getElementById('hist-count').textContent = __histRows.length + ' employee(s)';
  if (!__histRows.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No employees found.</td></tr>';
    return;
  }
  tbody.innerHTML = __histRows.map(r => {
    const initials = (r.first_name?.[0]||'') + (r.last_name?.[0]||'');
    const name = `${r.first_name||''} ${r.last_name||''}`.trim();
    const salPill = r.salary_change_count > 0
      ? `<span class="count-pill pill-salary">💰 ${r.salary_change_count}</span>`
      : `<span class="count-pill pill-zero">—</span>`;
    const promoPill = r.promotion_count > 0
      ? `<span class="count-pill pill-promo">⭐ ${r.promotion_count}</span>`
      : `<span class="count-pill pill-zero">—</span>`;
    return `
      <tr onclick="openEmployeeHistory(${r.id})">
        <td style="text-align:left">
          <div style="display:flex;align-items:center;gap:10px">
            ${r.profile_photo
              ? `<img class="hist-avatar" src="${r.profile_photo}">`
              : `<span class="hist-avatar">${initials}</span>`}
            <div>
              <div style="font-weight:700;font-size:12.5px">${name}</div>
              <div style="font-size:10.5px;color:var(--muted)">${r.employee_code||''}</div>
            </div>
          </div>
        </td>
        <td>${r.department_name||'—'}</td>
        <td>${r.designation_title||'—'}</td>
        <td>${r.level||'—'}</td>
        <td>${salPill}</td>
        <td>${fmt.date(r.last_salary_change)}</td>
        <td>${promoPill}</td>
        <td>${fmt.date(r.last_promotion)}</td>
      </tr>`;
  }).join('');
}

async function openEmployeeHistory(empId) {
  const body = document.getElementById('hist-detail-body');
  const title = document.getElementById('hist-detail-title');
  title.textContent = 'Loading…';
  body.innerHTML = '<div class="empty-state">Loading history…<br><span style="font-size:11px;color:var(--muted)">First request after inactivity can take up to a minute while the server wakes up.</span></div>';
  openModal('hist-detail-modal');

  // Hard fallback: if nothing has replaced this loading state within 20s (should
  // never happen since api() itself times out at 15s, but this guarantees the
  // modal can never appear silently frozen forever).
  const watchdog = setTimeout(() => {
    if (body.innerHTML.includes('Loading history')) {
      title.textContent = 'Employee History';
      body.innerHTML = `
        <div class="empty-state">
          This is taking longer than expected — the server may still be starting up.<br>
          <button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="openEmployeeHistory(${empId})">🔄 Retry</button>
        </div>`;
    }
  }, 20000);

  let res;
  try {
    res = await api('GET', `/history/employees/${empId}`);
  } catch (e) {
    res = { success: false, message: 'Unexpected error while loading history' };
  }
  clearTimeout(watchdog);

  if (!res || !res.success || !res.data || !res.data.employee) {
    title.textContent = 'Employee History';
    body.innerHTML = `
      <div class="empty-state">
        ${res?.message || 'Could not load history.'}<br>
        <button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="openEmployeeHistory(${empId})">🔄 Retry</button>
      </div>`;
    return;
  }

  const { employee: e, salary_history, promotion_history } = res.data;
  const name = `${e.first_name||''} ${e.last_name||''}`.trim();
  title.textContent = `${name} — ${e.employee_code||''}`;

  try {
    const header = `
      <div style="padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface2)">
        <div style="display:flex;flex-wrap:wrap;gap:22px;font-size:12px;color:var(--muted);align-items:center">
          <div><b style="color:var(--text)">Department:</b> ${e.department_name||'—'}</div>
          <div><b style="color:var(--text)">Designation:</b> ${e.designation_title||'—'}</div>
          <div><b style="color:var(--text)">Level:</b> ${e.level||'—'}</div>
          <div><b style="color:var(--text)">Current Annual CTC:</b> ${fmt.money(e.ctc)}</div>
          <button class="btn btn-outline btn-sm" style="margin-left:auto" onclick="downloadHistoryExcel()">⬇ Download Excel</button>
        </div>
      </div>`;

    const rowsData = salary_history || [];
    if (!rowsData.length) {
      body.innerHTML = header + '<div class="empty-state">No salary changes recorded yet.</div>';
      return;
    }

    // Designation held on each revision's effective date: the newest promotion
    // on/before that date; if none yet, the designation before the first
    // promotion (or the current one when there have been no promotions).
    const promos = [...(promotion_history || [])].sort((a, b) => new Date(a.effective_date) - new Date(b.effective_date));
    const desigOn = (dt) => {
      const d = new Date(dt);
      let cur = promos.length ? (promos[0].old_designation || e.designation_title) : e.designation_title;
      promos.forEach(pr => { if (new Date(pr.effective_date) <= d && pr.new_designation) cur = pr.new_designation; });
      return cur || '—';
    };
    const dt2 = (v) => v ? new Date(v).toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:true }) : '—';
    const M = (v) => (v === null || v === undefined || v === '') ? '—' : fmt.money(v);

    window._histExport = { name, code: e.employee_code, rows: [] };
    const TH = 'background:#1e293b;color:#fff;font-size:11px;font-weight:700;padding:8px 10px;border:1px solid #475569;white-space:nowrap;text-align:left';
    const TD = 'font-size:12px;padding:7px 10px;border:1px solid #cbd5e1;white-space:nowrap';
    const rowsHtml = rowsData.map((r, idx) => {
      const bg = idx % 2 ? '#f8fafc' : '#fff';
      const desig = desigOn(r.effective_date);
      const by = r.changed_by_name?.trim() || 'System';
      window._histExport.rows.push([
        String(r.effective_date || '').slice(0, 10), dt2(r.changed_at), desig, r.new_ctc ?? '', r.new_basic_salary ?? '',
        r.new_hra ?? '', r.new_special_allowance ?? '', r.new_travel_allowance ?? '', r.remarks || '', by
      ]);
      const chg = (o, n) => (o !== null && n !== null && Number(o) !== Number(n)) ? `<div style="font-size:10px;color:#b91c1c;text-decoration:line-through">${M(o)}</div>` : '';
      return `<tr style="background:${bg}">
        <td style="${TD};text-align:center;color:#64748b">${idx + 1}</td>
        <td style="${TD};font-weight:600">${fmt.date(r.effective_date)}</td>
        <td style="${TD};color:#475569">${dt2(r.changed_at)}</td>
        <td style="${TD}">${desig}</td>
        <td style="${TD};text-align:right;font-weight:700;color:#166534;background:#f0fdf4">${chg(r.old_ctc, r.new_ctc)}${M(r.new_ctc)}</td>
        <td style="${TD};text-align:right">${chg(r.old_basic_salary, r.new_basic_salary)}${M(r.new_basic_salary)}</td>
        <td style="${TD};text-align:right">${chg(r.old_hra, r.new_hra)}${M(r.new_hra)}</td>
        <td style="${TD};text-align:right">${chg(r.old_special_allowance, r.new_special_allowance)}${M(r.new_special_allowance)}</td>
        <td style="${TD};text-align:right">${chg(r.old_travel_allowance, r.new_travel_allowance)}${M(r.new_travel_allowance)}</td>
        <td style="${TD};white-space:normal;min-width:180px;color:#334155">${r.remarks ? r.remarks : '<span style="color:#94a3b8">—</span>'}</td>
        <td style="${TD};color:#64748b">${by}</td>
      </tr>`;
    }).join('');

    body.innerHTML = header + `
      <div style="padding:16px 20px;overflow-x:auto">
        <table style="border-collapse:collapse;width:100%;min-width:1000px">
          <thead>
            <tr>
              <th style="${TH};text-align:center">#</th>
              <th style="${TH}">Effective Date</th>
              <th style="${TH}">CTC Uploaded Date</th>
              <th style="${TH}">Designation</th>
              <th style="${TH};background:#166534;text-align:right">Annual CTC</th>
              <th style="${TH};background:#334155;text-align:right">Basic</th>
              <th style="${TH};background:#334155;text-align:right">HRA</th>
              <th style="${TH};background:#334155;text-align:right">Defray Allowance</th>
              <th style="${TH};background:#334155;text-align:right">Travel Allowance</th>
              <th style="${TH}">Comments</th>
              <th style="${TH}">Updated By</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <div style="font-size:11px;color:var(--muted);margin-top:8px">Struck-through amounts are the previous value.</div>
      </div>`;
  } catch (renderErr) {
    console.error('[openEmployeeHistory render]', renderErr);
    body.innerHTML = `
      <div class="empty-state">
        Something went wrong displaying this employee's history.<br>
        <button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="openEmployeeHistory(${empId})">🔄 Retry</button>
      </div>`;
  }
}

// Opens in Excel: CSV with the same columns as the table.
function downloadHistoryExcel() {
  const d = window._histExport; if (!d) return;
  const head = ['Effective Date','CTC Uploaded Date','Designation','Annual CTC','Basic','HRA','Defray Allowance','Travel Allowance','Comments','Updated By'];
  const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = '\ufeff' + [head, ...d.rows].map(r => r.map(q).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `Salary_History_${d.code || d.name}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

loadEmployeeHistoryList();
</script>
</body>
</html>
