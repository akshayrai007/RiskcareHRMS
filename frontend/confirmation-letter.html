<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RiskCare HR - Confirmation Letters</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .cl-wrap { max-width:720px; margin:0 auto; }
  .cl-card  { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:16px; }
  .cl-card h3 { margin:0 0 16px; font-size:1rem; color:var(--accent); }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .form-row.single { grid-template-columns:1fr; }
  .field label { display:block; font-size:.78rem; font-weight:700; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
  .field input, .field select { width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:8px; font-size:.9rem; background:var(--surface2); color:var(--text); }
  .field input:focus, .field select:focus { border-color:var(--accent); outline:none; }
  .emp-search-wrap { position:relative; }
  #emp-dropdown { position:absolute; top:100%; left:0; right:0; background:var(--surface); border:1px solid var(--border); border-radius:8px; z-index:50; max-height:200px; overflow-y:auto; box-shadow:0 4px 16px rgba(0,0,0,.12); display:none; }
  .emp-opt { padding:9px 14px; cursor:pointer; font-size:.88rem; border-bottom:1px solid var(--border); }
  .emp-opt:hover { background:var(--surface2); }
  .emp-opt .code { font-size:.75rem; color:var(--muted); }
  .btn-row { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .emp-info { background:var(--surface2); border-radius:8px; padding:12px 16px; margin-top:12px; font-size:.88rem; display:none; }
  .emp-info table td { padding:3px 10px 3px 0; }
  .emp-info table td:first-child { color:var(--muted); font-weight:600; white-space:nowrap; }
  iframe#preview-frame { width:100%; height:75vh; border:none; border-radius:8px; background:#f5f5f5; display:none; margin-top:16px; }
  .status-msg { padding:10px 14px; border-radius:8px; font-size:.88rem; display:none; margin-top:10px; }
  .status-msg.ok  { background:#dcfce7; color:#166534; }
  .status-msg.err { background:#fee2e2; color:#991b1b; }
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark" id="sidebar-logo-mark"></div>
    <div><div class="logo-text-wrap"><div class="logo-text" id="sidebar-logo-text"></div></div>
    <div class="sidebar-company-short" id="sidebar-company-short"></div></div>
  </div>
  <nav id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <div id="sidebar-user"></div>
    <button class="logout-btn" onclick="Auth.logout()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out</button>
  </div>
</aside>
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Menu"><span></span><span></span><span></span></button>
      <div class="topbar-title">Confirmation Letters</div>
    </div>
    <div class="topbar-right">
      <button id="notif-bell-btn" class="topbar-icon-btn notif-btn" title="Notifications">🔔<span id="notif-badge"></span></button>
      <a class="topbar-icon-btn" href="dashboard.html" title="Dashboard">🏠</a>
    </div>
  </div>
  <div class="content fade-in">
  <div class="cl-wrap">

    <!-- Employee Search -->
    <div class="cl-card">
      <h3>Select Employee</h3>
      <div class="form-row single">
        <div class="field">
          <label>Search Employee</label>
          <div class="emp-search-wrap">
            <input type="text" id="emp-search" placeholder="Type name or employee code…" autocomplete="off">
            <div id="emp-dropdown"></div>
          </div>
        </div>
      </div>
      <input type="hidden" id="emp-id">
      <div class="emp-info" id="emp-info">
        <table>
          <tr><td>Employee</td><td id="ei-name">—</td></tr>
          <tr><td>Code</td><td id="ei-code">—</td></tr>
          <tr><td>Designation</td><td id="ei-desig">—</td></tr>
          <tr><td>Department</td><td id="ei-dept">—</td></tr>
          <tr><td>Joining Date</td><td id="ei-join">—</td></tr>
          <tr><td>Email</td><td id="ei-email">—</td></tr>
        </table>
      </div>
    </div>

    <!-- Letter Details -->
    <div class="cl-card" id="letter-details" style="display:none">
      <h3>Letter Details</h3>
      <div class="form-row">
        <div class="field">
          <label>Probation End Date</label>
          <input type="date" id="probation-end">
        </div>
        <div class="field">
          <label>Confirmation Date (Effective From)</label>
          <input type="date" id="confirmation-date">
        </div>
      </div>
      <div class="form-row single">
        <div class="field">
          <label>Send To Email</label>
          <input type="email" id="send-email" placeholder="employee@email.com">
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="previewLetter()">👁 Preview PDF</button>
        <button class="btn btn-secondary" onclick="downloadLetter()">⬇ Download PDF</button>
        <button class="btn btn-outline" onclick="sendLetter()" id="send-btn">📧 Send via Email</button>
      </div>
      <div class="status-msg" id="status-msg"></div>
    </div>

    <!-- PDF Preview -->
    <iframe id="preview-frame" title="Confirmation Letter Preview"></iframe>

  </div>
  </div>
</div>

<script src="app.js"></script>
<script>
buildSidebar('confirmation-letter.html');

let _employees = [];
let _selectedEmp = null;

async function loadEmployees() {
  try {
    const data = await api('GET', '/employees?active=true&limit=500');
    _employees = (data.employees || data || []).filter(e => e.id);
  } catch(e) { console.error(e); }
}
loadEmployees();

document.getElementById('emp-search').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  const dd = document.getElementById('emp-dropdown');
  if (!q || q.length < 2) { dd.style.display='none'; return; }
  const matches = _employees.filter(e =>
    (e.full_name||`${e.first_name} ${e.last_name||''}`).toLowerCase().includes(q) ||
    (e.employee_code||'').toLowerCase().includes(q)
  ).slice(0, 15);
  if (!matches.length) { dd.style.display='none'; return; }
  dd.innerHTML = matches.map(e => {
    const name = e.full_name || `${e.first_name} ${e.last_name||''}`.trim();
    return `<div class="emp-opt" onclick="selectEmp(${e.id},'${name.replace(/'/g,"\\'")}')">
      ${name} <span class="code">${e.employee_code||''} · ${e.designation||''}</span>
    </div>`;
  }).join('');
  dd.style.display='block';
});

async function selectEmp(id, name) {
  document.getElementById('emp-search').value = name;
  document.getElementById('emp-id').value = id;
  document.getElementById('emp-dropdown').style.display='none';
  try {
    const data = await api('GET', `/employees/${id}`);
    const e = data.employee || data;
    _selectedEmp = e;
    document.getElementById('ei-name').textContent  = `${e.first_name||''} ${e.last_name||''}`.trim();
    document.getElementById('ei-code').textContent  = e.employee_code||'—';
    document.getElementById('ei-desig').textContent = e.designation||'—';
    document.getElementById('ei-dept').textContent  = e.department||'—';
    document.getElementById('ei-join').textContent  = e.joining_date ? new Date(e.joining_date).toLocaleDateString('en-IN') : '—';
    document.getElementById('ei-email').textContent = e.work_email || e.personal_email || '—';
    document.getElementById('send-email').value     = e.work_email || e.personal_email || '';
    if (e.provision_end_date) document.getElementById('probation-end').value = e.provision_end_date.slice(0,10);
    if (e.confirmed_date)     document.getElementById('confirmation-date').value = e.confirmed_date.slice(0,10);
    else document.getElementById('confirmation-date').value = new Date().toISOString().slice(0,10);
    document.getElementById('emp-info').style.display='block';
    document.getElementById('letter-details').style.display='block';
    document.getElementById('preview-frame').style.display='none';
  } catch(err) { console.error(err); }
}

document.addEventListener('click', e => {
  if (!e.target.closest('.emp-search-wrap')) document.getElementById('emp-dropdown').style.display='none';
});

function buildPreviewUrl(download) {
  const id   = document.getElementById('emp-id').value;
  const conf = document.getElementById('confirmation-date').value;
  const prob = document.getElementById('probation-end').value;
  if (!id) { alert('Please select an employee first'); return null; }
  let url = `${API_BASE}/employees/${id}/confirmation-letter?token=${Auth.getToken()}`;
  if (download) url += '&download=1';
  if (conf) url += `&confirmation_date=${conf}`;
  if (prob) url += `&probation_end_date=${prob}`;
  return url;
}

function previewLetter() {
  const url = buildPreviewUrl(false);
  if (!url) return;
  const frame = document.getElementById('preview-frame');
  frame.src = url;
  frame.style.display='block';
  frame.scrollIntoView({ behavior:'smooth' });
}

function downloadLetter() {
  const url = buildPreviewUrl(true);
  if (url) window.open(url, '_blank');
}

async function sendLetter() {
  const id    = document.getElementById('emp-id').value;
  const email = document.getElementById('send-email').value.trim();
  const conf  = document.getElementById('confirmation-date').value;
  const prob  = document.getElementById('probation-end').value;
  if (!id)    { alert('Please select an employee first'); return; }
  if (!email) { alert('Please enter an email address'); return; }
  const btn = document.getElementById('send-btn');
  const msg = document.getElementById('status-msg');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const res = await api('POST', `/employees/${id}/send-confirmation-letter`, { email, confirmation_date: conf, probation_end_date: prob });
    msg.textContent = res.message || 'Sent successfully!';
    msg.className = 'status-msg ok'; msg.style.display='block';
  } catch(err) {
    msg.textContent = err.message || 'Failed to send email';
    msg.className = 'status-msg err'; msg.style.display='block';
  } finally {
    btn.disabled = false; btn.textContent = '📧 Send via Email';
  }
}
</script>
</body>
</html>
